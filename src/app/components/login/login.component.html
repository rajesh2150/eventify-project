<app-nav></app-nav>
<div class="login-conatiner">
  <div class="login-conatiner-img-form">
    <!-- <div>
      <img class="login-image" height="300px" width="300px" style="background-color: lightblue;"/>
    </div> -->
    <div class="login-form-container">
      <div class="card shadow-lg p-4">
        <h2 class="text-center mb-4">Login</h2>
        <p *ngIf="erroMessage" class="text-danger text-center">{{erroMessage}}</p>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <!-- Email Field -->
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-control" formControlName="email" placeholder="Enter your email" required />
            <div *ngIf="email?.invalid && email?.touched" class="text-danger">
              <small *ngIf="email?.errors?.['required']">Email is required.</small>
              <small *ngIf="email?.errors?.['email']">Please enter a valid email address.</small>
            </div>
          </div>
  
          <!-- Password Field -->
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-control" formControlName="password" placeholder="Enter your password" required />
            <div *ngIf="password?.invalid && password?.touched" class="text-danger">
              <small *ngIf="password?.errors?.['required']">Password is required.</small>
              <small *ngIf="password?.errors?.['minlength']">Password must be at least 8 characters long.</small>
            </div>
          </div>
  
          <!-- Role Selection -->
          <div class="form-group">
            <label for="role">Role</label>
            <select id="role" class="form-control" formControlName="role" required>
              <option value="attendee">Attendee</option>
              <option value="organizer">Organizer</option>
            </select>
          </div>
  
          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary w-100 mt-3" [disabled]="loginForm.invalid">
            Login
          </button>
        </form>
  
        <!-- Signup Link -->
        <div class="text-center mt-3">
          <small>Don't have an account? <a href="/registration">Sign Up</a></small>
        </div>
      </div>

  </div>
 
</div>
