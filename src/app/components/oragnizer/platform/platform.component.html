<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4 text-center" style="width: 350px;" *ngIf="showPayment">
      <h4 class="mb-3">Pay to Platform</h4>
  
      <div class="form-group">
        <label for="amount" class="font-weight-bold">Amount</label>
        <input type="number" id="amount" class="form-control text-center" [(ngModel)]="amount" placeholder="₹ Enter Amount" min="1" readonly>
      </div>
  
      <button class="btn btn-primary mt-3 w-100" (click)="pay()" [disabled]="isProcessing || !amount">
        Pay Now
      </button>
  
      <div *ngIf="isProcessing" class="mt-3 text-warning">
        <i class="fas fa-spinner fa-spin"></i> Processing Payment...
      </div>
    </div>
  
    <div *ngIf="paymentSuccess" class="text-center mt-4">
      <i class="fas fa-check-circle text-success fa-3x"></i>
      <h4 class="text-success mt-2">Payment Successful!</h4>
      <p class="text-muted">Transaction ID: <strong>{{ transactionId }}</strong></p>
    </div>
  </div>
